<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","title":"Sairaanhoitaja, Tyks Sydänkeskus, Sydänosasto 1 ja 2, Turku","hiringOrganization":"Varsinais-Suomen hyvinvointialue, Tyks/sairaalapalvelut, Operatiiviset alat, Tyks Sydänkeskus","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressRegion":"Varsinais-Suomi","addressLocality":"Turku","postalCode":20520,"streetAddress":"Tyks T-sairaala, Hämeentie 11"}},"datePosted":"2026-11-16T15:52:00+02:00","baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":"Tehtäväkohtainen palkka 3300,00 €/kk"},"description":"Kiinnostaako sinua akuutti sydänpotilaan hoitotyö ja mahdollisuus kehittää osaamistasi jatkuvasti uudistuvassa Sydänkeskuksessa? Tule osaksi sydämellistä työyhteisöämme!Haemme nyt kahta sairaanhoitajaa Tyks Sydänkeskuksen sydänosastoille 1 ja 2!TehtäväsiSairaanhoitajana työskentelet monipuolisissa ja vastuullisissa tehtävissä sydänpotilaiden hoidon eri vaiheissa. Pääasiallinen työskentelypaikkasi työsuhteen alussa on Sydänosasto 1 ja 2.Sydänosasto 1 on 25 sairaansijan päivystävä osasto, jossa hoidetaan akuutisti sairastuneita sydänpotilaita. Sydänosasto 2 puolestaan on 8–14 sairaansijan osasto, jossa hoidetaan tutkimuksiin ja toimenpiteisiin tulevia potilaita lyhyiden hoitojaksojen aikana.Työssäsi vastaat akuutisti sairastuneiden potilaiden hoitotyöstä, lääkehoidosta sekä potilaiden valmistelusta erilaisiin sydäntoimenpiteisiin ja toimenpiteiden jälkeisestä tarkkailusta. Tehtäviisi kuuluvat myös potilaiden ja heidän läheistensä ohjaus ja tukeminen, kuntouttava hoitotyö sekä opiskelijaohjaus. Pääset osallistumaan aktiivisesti hoitotyön kehittämiseen ja hyödyntämään digitalisaation tarjoamia mahdollisuuksia potilashoidossa ja -ohjauksessa.Tyks Sydänkeskuksessa työskentelet osana moniammatillista työyhteisöä, jossa potilaan hoidon sujuvuudesta huolehditaan yhteistyössä yli osasto- ja yksikkörajojen. Kehitämme yhdessä näyttöön perustuvaa hoitotyötä ja uusia hoitokäytäntöjä.Sydänkeskus vastaa vaativien sydän-, thorax- ja verisuonisairauksien hoidosta sekä tarjoaa monipuolisia polikliinisia palveluja. Toimintaamme kuuluvat sydänosastot, sydänvalvonta, sydäntoimenpideosasto, verisuonikirurgian osasto ja poliklinikka sekä sydänpoliklinikat Turussa, Loimaalla, Salossa ja Uudessakaupungissa. Potilashoidon lisäksi teemme tieteellistä tutkimusta, kehitämme uusia hoitomuotoja ja koulutamme alan opiskelijoita sekä ammattilaisia.Työ on kolmivuorotyötä. Toimipaikkakoulutuksen jälkeen osallistut päivystysaikana sydäntoimenpiteisiin Sydäntoimenpideosastolla yhtenä tiimin jäsenenä.Mitä tarjoamme sinulle?Tarjoamme sinulle mahdollisuuden tehdä merkityksellistä ja monipuolista hoitotyötä modernissa, jatkuvasti kehittyvässä Sydänkeskuksessa. Meillä pääset vahvistamaan ammattitaitoasi, oppimaan uutta ja kehittämään sydänpotilaiden hoitoa yhdessä osaavien ammattilaisten kanssa.Panostamme yksilölliseen perehdytykseen ja ammatilliseen kehittymiseesi. Perehdytyksessä huomioimme aikaisemman kokemuksesi ja osaamisesi. Perehtymistäsi tukevat suunnitelmallinen perehdytysjakso, mentoritoiminta, esihenkilön kanssa käytävät keskustelut, sähköiset materiaalit sekä koulutukset. Saat tukea työhösi kollegoiltasi, tiimiltäsi ja esihenkilöltäsi.Meillä sinulla on mahdollisuus kehittää osaamistasi myös työkierron kautta sekä kokemuksen ja kiinnostuksesi karttuessa erikoistua hoitotyön eri osa-alueiden asiantuntijaksi tai erilaisiin tehtävärooleihin.Työyhteisössämme korostuvat yhteistyö, keskinäinen auttaminen ja toisten arvostaminen. Haluamme, että jokainen tulee kohdatuksi ystävällisesti ja kunnioittavasti niin potilaana kuin työkaverinakin.Tuemme työhyvinvointiasi yhteisöllisellä työvuorosuunnittelulla, työhyvinvointitoiminnalla ja viikoittaisilla koulutuksilla. Meillä et jää yksin haastavissakaan tilanteissa, vaan saat tueksesi työkavereiden ja koko työyhteisön osaamisen.Mitä odotamme sinulta?Toivomme sinulta kiinnostusta akuuttiin sydänpotilaan hoitotyöhön sekä aitoa halua kehittää omaa osaamistasi ja hoitotyön käytäntöjä. Arvostamme innovatiivista ja kehittämismyönteistä työotetta sekä kiinnostusta digitalisaation mahdollisuuksiin hoitotyössä ja potilasohjauksessa.Työssäsi onnistumista tukevat hyvät yhteistyö- ja vuorovaikutustaidot, joustavuus sekä potilaslähtöinen ja kunnioittava työskentelytapa. Haluat olla aktiivinen osa sydänpotilaan hoito- ja palveluketjua ja edistää sujuvaa yhteistyötä eri ammattilaisten ja yksiköiden välillä.Aikaisempi kokemus akuutin sydänpotilaan hoitotyöstä katsotaan eduksi, mutta tärkeintä on kiinnostuksesi sydänpotilaiden hoitoon ja halusi oppia uutta.Edellytämme hyvää suomen kielen taitoa ja arvostamme ruotsin kielen osaamista.Kelpoisuusvaatimuksena on terveydenhuollon ammattihenkilöistä annetun lain (559/1994) mukainen sairaanhoitajan laillistus.Haluatko päästä tekemään monipuolista sydänpotilaan hoitotyötä ja kehittämään osaamistasi osana Tyks Sydänkeskuksen työyhteisöä? Lähetä hakemuksesi ja tule mukaan joukkoomme!","employmentType":"Kokoaikatyö, 3-vuorotyö, Työpaikka, Vakinainen, Anonyymi, Työsuhde","validThrough":"2026-11-30T23:59:00+02:00"}</script>
