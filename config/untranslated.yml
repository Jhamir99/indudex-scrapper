  feinaactiva: "«No es pot alterar el contingut de la informació. No es pot desnaturalitzar el sentit de la informació.» (https://web.gencat.cat/ca/generalitat/dades-indicadors/dades-obertes/llicencies)"
  gencat: "«No es pot alterar el contingut de la informació. No es pot desnaturalitzar el sentit de la informació.» (https://web.gencat.cat/ca/generalitat/dades-indicadors/dades-obertes/llicencies)"
