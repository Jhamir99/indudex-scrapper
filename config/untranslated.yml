# Sources whose terms ask that what they publish is not altered, translated or given another sense:
# their titles are kept as written (no capitals brought down, advert-facts FR-4) and shown untranslated
# in every language of the site (title-translation). Each with the clause that asks it and where it was
# read. Sources that allow changes with a notice of them (CC BY, Datenlizenz Deutschland) are not here.
#
# Imported on 2026-11-19 from the legacy Indudex project (https://github.com/JustJans/indudex, © 2026
# JustJans), builder/config/untranslated.yml, read there on 27 October 2026 (the owner's rule: respect what
# each source asks about altering and translating its offers). Validated by src/shared/config/untranslated.ts.

sources:
