  bund: "«Texte […] dürfen, soweit diese urheberrechtlich geschützt sind, ohne vorherige Zustimmung […] nicht vervielfältigt […] werden» (https://www.service.bund.de/Content/DE/Service/Impressum/impressum_node.html)"
