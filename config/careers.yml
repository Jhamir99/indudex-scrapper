  # ➤ Roche (Phenom): its robots.txt names the Chinese sitemap first, which lists every vacancy under
  # ➤ /cn/zh/; the same vacancy opens in English under /global/en/ with the same number, so that is the
  # ➤ address shown (15 October 2026).
  - name: Roche
    host: careers.roche.com
    match: /cn/zh/job/
    rewrite: [/cn/zh/job/, /global/en/job/]
  # ➤ Three Spanish employers on Bizneo with their own domain (no JobPosting block; platformPosting reads
  # ➤ the page's "Ubicación" box): Experience IS lists 165 vacancies on 17 pages, more than the ten a
  # ➤ "next" link is followed through; the hunter named them "Experienceis" and "Uax" (17 October 2026).
  # ➤ Their job sites link no terms, but each is part of its company's web, whose notice asks leave to
  # ➤ copy its content: the owner (28 October 2026) puts a job site that comes from the main web under
  # ➤ its notice. JCarrión's was the hunter's (state/found/hunted.yml): listed here to switch it off.
  - name: Experience IS
    listing: https://jobs.experienceis.com/jobs
    paged: https://jobs.experienceis.com/jobs?page={n}
    match: /jobs/
    enabled: false        # ➤ asks leave: off until given (docs/research/permission-list.md)
  - name: Universidad Alfonso X el Sabio
    listing: https://jobs.uax.com/jobs
    paged: https://jobs.uax.com/jobs?page={n}
    match: /jobs/
    enabled: false        # ➤ asks leave: off until given (docs/research/permission-list.md)
  - name: JCarrión
    listing: https://ofertas.jcarrion.es/jobs
    enabled: false        # ➤ asks leave: off until given (docs/research/permission-list.md)
