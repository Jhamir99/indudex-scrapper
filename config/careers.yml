# Taken from builder/config/careers.yml of the legacy Indudex project (https://github.com/JustJans/indudex, © 2026 JustJans), as
# of 27 November 2026 (JustJans/indudex@ec79858), byte for byte below this header: read by
# src/features/career-sites/lists.ts (features/016-career-sites). Its keys are the legacy's, as its careers and
# board readers (copied into that feature) read them.
#
# Employers' careers sites read without an API: the sitemap lists the vacancy pages and each
# page carries a schema.org JobPosting block (what search engines read). One entry per site:
# its name as shown to visitors, the sitemap address, `match` (a piece of the address every
# vacancy page shares; without it, addresses that look like vacancies are taken), and
# optionally the country (iso) and the language of the adverts, and enabled: false to pause.
# The careers scout (builder/tools/scout-careers.ts) writes careers-found.yml the same way.
sites:
  - name: Van Oord
    sitemap: https://careers.vanoord.com/sitemap.xml
    match: /vacancies/
    country: nl
  - name: Boskalis
    sitemap: https://careers.boskalis.com/sitemap.vacancy.xml
    match: /vacancy/
    country: nl
  - name: Approach People
    host: www.approachpeople.com
  # ➤ The Land of Berlin's careers portal (its administrations and districts): a list of twenty a page
  # ➤ followed through its "next" link, each vacancy with its JobPosting block; robots.txt closes it only
  # ➤ to generic HTTP libraries, and its imprint asks only that use stay within the law (read 10 October 2026).
  - name: Land Berlin
    host: www.karriereportal-stellen.berlin.de
    listing: https://www.karriereportal-stellen.berlin.de/stellenangebote.html
    match: -de-j
    pages: 40
    country: de
    lang: de
  # ➤ Mecklenburg-Vorpommern's careers portal (the Land's administrations): every vacancy on one page,
  # ➤ each with its JobPosting block; robots.txt sets no rule and its imprint holds only a disclaimer.
  - name: Land Mecklenburg-Vorpommern
    host: karriere-in-mv.de
    listing: https://karriere-in-mv.de/uebersicht/stelle
    match: /stelle/
    country: de
    lang: de
  # ➤ The Lufthansa Group's applicant system (Lufthansa Technik, the airlines, Lufthansa Systems and the
  # ➤ rest): a sitemap of its vacancies, each page with its JobPosting block. Its robots.txt names only
  # ➤ the sitemap; its terms ask consent only to copy texts and pictures (read 10 October 2026).
  - name: Lufthansa Group
    host: apply.lufthansagroup.careers
    sitemap: https://apply.lufthansagroup.careers/sitemap.xml
    match: ac=jobad
  # ➤ The savings banks on Perbility's CHECK-IN: sparkasse.de's job board names each bank's list,
