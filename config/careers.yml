    sitemap: https://careers.baloise.com/careers/sitemap_index.xml
    match: /JobDetail/
  - name: Deloitte Central Europe
    host: apply.deloittece.com
    sitemap: https://apply.deloittece.com/careers/sitemap_index.xml
    match: /JobDetail/
    layout: true
  - name: Transcom
