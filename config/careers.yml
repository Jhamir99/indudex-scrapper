  # ➤ The Dutch central government's SuccessFactors feed (Defensie, its agencies, the ministries) names itself
  # ➤ "WenS"; its 5,241 vacancies are the Rijksoverheid's (17 October 2026).
  - name: Rijksoverheid
    feed: https://jobs.werkenvoornederland.nl/jobs.xml
    country: nl
  # ➤ Booking.com's Jibe careers site draws its list from /api/jobs, open to robots (Crawl-delay 5); each
  # ➤ vacancy page carries its JobPosting block.
  - name: Booking.com
    host: jobs.booking.com
    listing: https://jobs.booking.com/api/jobs?limit=100&page=1
    paged: https://jobs.booking.com/api/jobs?limit=100&page={n}
    match: /booking/jobs/
  # ➤ NTT DATA's group sites, each under its company's own notice (the owner's rule of 28 October 2026; decision 10
  # ➤ of the audit, read on 15 November 2026: docs/CERRADAS.md, docs/research/permission-list.md). NTT DATA, Inc.'s
  # ➤ terms forbid «spiders, crawlers, bots» without leave: its UK, US, German and Singapore companies, and its
  # ➤ global careers site, now careers.nttdata.com itself. NTT DATA Business Solutions asks leave to copy. On
  # ➤ nttdata.com each is off alone: NTT DATA Italia's site there has its own notice and stays read, as do NTT DATA
  # ➤ Romania's (no terms) and Tangity's (none).
  - name: NTT DATA UK
    host: nttdata.jobs
    enabled: false        # ➤ its terms forbid robots (docs/CERRADAS.md)
  - name: NTT DATA, Inc. (careers.services.global.ntt)
    host: careers.services.global.ntt
    enabled: false        # ➤ its terms forbid robots, and it leads to careers.nttdata.com (docs/CERRADAS.md)
  - name: NTT DATA Services (careers-inc.nttdata.com)
    host: careers-inc.nttdata.com
    enabled: false        # ➤ its terms forbid robots (docs/CERRADAS.md)
    alone: true
  - name: NTT DATA Deutschland (de.nttdata.com)
    sitemap: https://de.nttdata.com/sitemap.xml
    enabled: false        # ➤ its terms forbid robots (docs/CERRADAS.md)
    alone: true
  - name: NTT DATA Business Solutions
    host: careers.nttdata-solutions.com
    enabled: false        # ➤ asks leave: off until given (docs/research/permission-list.md)
  # ➤ bess pro and bess medizintechnik (medical devices, Germany and Austria): their imprints forbid any use or copy
  # ➤ of their content "ohne unsere ausdrückliche schriftliche Genehmigung" (read 24 November 2026): off until the
  # ➤ owner has it (docs/research/permission-list.md).
  - name: bess pro gmbh
    host: besspro.eu
    enabled: false
  - name: bess medizintechnik gmbh
    host: bess.eu
    enabled: false
