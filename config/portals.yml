  # Germany's boards (17 October 2026, docs/research/job-portals.md). Stellenmarkt.de (Karrieremagazin
  # Verlag, Frankfurt): its robots.txt is empty, its imprint and terms (for advertisers) set no limit, and it
  # offers its job feeds for other sites. No sitemap and no title in its addresses ("/anzeige26313386.html"):
  # its search lists by job word, fifteen a page. The 17 that bring most of ours per page (about 730 pages)
  # are walked once a day, and every vacancy they name is read.
  - name: Stellenmarkt.de
    host: www.stellenmarkt.de
    country: de
    lists:
      - https://www.stellenmarkt.de/stellenangebote-techniker
      - https://www.stellenmarkt.de/stellenangebote-elektroniker
      - https://www.stellenmarkt.de/stellenangebote-mechatroniker
      - https://www.stellenmarkt.de/stellenangebote-informatiker
      - https://www.stellenmarkt.de/stellenangebote-schlosser
      - https://www.stellenmarkt.de/stellenangebote-ingenieur
      - https://www.stellenmarkt.de/stellenangebote-engineer
      - https://www.stellenmarkt.de/stellenangebote-schweisser
      - https://www.stellenmarkt.de/stellenangebote-bauleiter
      - https://www.stellenmarkt.de/stellenangebote-anlagenmechaniker
      - https://www.stellenmarkt.de/stellenangebote-architekt
      - https://www.stellenmarkt.de/stellenangebote-programmierer
      - https://www.stellenmarkt.de/stellenangebote-konstrukteur
      - https://www.stellenmarkt.de/stellenangebote-monteur
      - https://www.stellenmarkt.de/stellenangebote-administrator
      - https://www.stellenmarkt.de/stellenangebote-zerspanungsmechaniker
