    layout: true
    readAll: true
  # Germany's biggest employers' own careers sites, read as portals (10 October 2026).
  # Deutsche Bahn: robots.txt opens everything and its imprint sets no limit on reuse; a fifth of
  # its vacancies' addresses carry no title, so every vacancy page is read.
  - name: Deutsche Bahn
    host: db.jobs
    country: de
    sitemap: https://db.jobs//service-sitemap-DEabb9885062448d6945c87a820ba891-sitemap_index.xml
    match: "/de-de/Suche/"
    readAll: true
  # Mercedes-Benz: its group's legal notice keeps its pages from being copied for commercial use
