# Job portals and agencies read as search engines read them (features/015-job-portals, read by
# src/features/job-portals/portal-list.ts). Taken from builder/config/portals.yml of the legacy Indudex project
# (https://github.com/JustJans/indudex, © 2026 JustJans), as of 25 November 2026: its 865 entries, the
# switched-off ones with their reason as data (`off`), its keys in camelCase as config/crawl.yml writes them.
# The rule for reading a portal is in AGENTS.md ("Portals").
#
# Job portals read as search engines read them, by the owner's decision of 7 October 2026
# (docs/research/job-portals.md): robots.txt lets the crawler in, no bot wall stands in front, and
# their vacancy pages carry a JobPosting block. builder/adapters/portals.ts reads them.
#   sitemap:  where the vacancies are listed (a sitemap or an index)
#   children: in an index, the sitemaps that hold vacancies (a pattern)
#   match:    the shape of a vacancy's address (a pattern); without it, what looks like one
#   readAll: every vacancy page is read (its address carries no title to sort by)
#   country:  without it, the locale at the start of each address ("/de-at/")
#   key:      the part's own name, when one host is read in parts (a sitemap per country)
#   alone:    switched off by itself only, its domain still read another way (builder/switched-off.ts)
#   layout:   its vacancy pages carry no JobPosting block and are read from their HTML
#             (builder/lib/layout.ts); a page over a year old by its own date is left
# Recruitment agencies too. Since 9 October 2026 (the owner's rule) a source is left out only when it
# says, clearly and specifically, that it does not want bots like ours: robots.txt closing the way,
# a bot wall, or a clause against robots, scraping, crawling, data mining or automated extraction;
# personal-use, non-commercial or no-copying clauses are no reason. Left out by that rule:
# Randstad Spain (robots and crawlers), Randstad Czechia (spidering), Manpower Netherlands (scraping,
# data mining), Experis UK (downloading by programme), Morson (data mining), NES
# Fircroft (text-and-data-mining reservation), jobtalent.be (scraping, spidering), CTC Resourcing,
# Opus, SR2, Investigo (automated collection), NRL, Rullion, Cegeka, Advance TRS, Amoria Bond, Hamilton
# Barnes, and those marked below. Agencies that recruit abroad carry no country here: their adverts
# name their own.
portals:
  - name: Free-Work
    host: www.free-work.com
    country: fr
    sitemap: https://statics.free-work.com/sitemapindex.xml
    children: sitemap-job-postings-fr--
    match: /job-mission/
  - name: Les Jeudis
    host: lesjeudis.com
    off: "its terms forbid robots and automated scraping (re-read 7 October 2026)"
    country: fr
    sitemap: https://lesjeudis.com/sitemap/offre.xml
    match: /offers/
  # WeRecruit, an applicant-tracking platform: the career sites of its 1,232 employers, every
  # vacancy in one sitemap (20,860 on 9 October 2026), each page with its JobPosting block.
  # robots.txt opens all; its terms of sale say it spreads its clients' offers to other sites. Its
  # legal notice asks written leave for the photos and texts WeRecruit itself made, not for the
  # employers' vacancies.
  - name: WeRecruit
    host: careers.werecruit.io
    country: fr
    sitemap: https://careers.werecruit.io/sitemap.xml
    match: /offres/
