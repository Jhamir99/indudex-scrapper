# How often sources are read and how hard the scrapper may work.
# Validated by src/features/crawl-core/config/crawl-config.ts.
#
# Values taken from builder/config/crawl.yml of the legacy Indudex project
# (https://github.com/JustJans/indudex, © 2026 JustJans), as of 15 November 2026.
# They are the result of its operating experience (servers and firewalls that
# turned the crawler away); change them only with a reason.

cadence:
  # One pass a day tells a closed vacancy from an open one and brings the new ones.
  defaultHours: 24
  # A source that comes back unchanged waits half as long again each pass, up to a week.
  unchangedMaxHours: 168

backoff:
  # A failing source waits a day, three, then a week; after 6 failures it is parked for a month.
  hours: [24, 72, 168]
  parkAfterFailures: 6
  parkedHours: 720

pace:
  perHost:
    gapMs: 3000
    inFlight: 1
  # Nutch's five seconds, for every host on one machine together.
  perServer:
    gapMs: 5000
    inFlight: 1
  perProvider:
    gapMs: 3000
    inFlight: 1
  # Hosts with their own gap, from the legacy adapters' own pace (public-feeds FR-4).
  hosts:
    # Arbetsförmedlingen's JobSearch API, made for programs: 69 groups and their pages.
    jobsearch.api.jobtechdev.se: 200
    # Finland's public-sector platform: its list and the page of each new vacancy.
    kuntarekry.fi: 500
    valtiolle.fi: 500
    # Poland's Infopraca: forty searches, every page, and the pages of new offers.
    www.infopraca.pl: 1000
    # Slovakia's ÚPSVaR: its list, a hundred a call, and the pages of new offers.
    www.sluzbyzamestnanosti.gov.sk: 1000
    # Hungary's VMP: its firewall refuses a line after about a dozen requests, even a minute apart.
    vmp.munka.hu: 60000
    # Croatia's HZZ: one RSS feed per county, 21 calls.
    burzarada.hzz.hr: 500
    # Romania's ANOFM: its list, a hundred a call.
    mediere.anofm.ro: 1000
    # Cyprus's PESCPS: one search per occupation of ours.
    pescps.dl.mlsi.gov.cy: 1500
    # Portugal's IEFP: its search, a hundred a page, and the pages of new offers.
    iefponline.iefp.pt: 1000
    # Girona's SPIN: its list and the page of each offer.
    spin.girona.cat: 1500
    # service.bund.de: its robots.txt asks 30 s between pages.
    www.service.bund.de: 30000
    # Karriere.NRW's open API: about a hundred pages of ten.
    api.karriere.nrw: 300
    # Brussels' Actiris: its list, a hundred a call, and the pages of new offers.
    www.actiris.brussels: 1000
    # Italy: Emilia-Romagna's and Trento's job portals (MyPortal) and Brescia's job site.
    lavoroperte.regione.emilia-romagna.it: 1000
    www.sil.provincia.tn.it: 1000
    lavoro.provincia.brescia.it: 1000

connections:
  # At about 7 new connections a second the legacy's home router dropped them all.
  maxOpen: 16
  newPerSecond: 2

# A server that gives 3 error answers (4xx, robots.txt aside) within 10 minutes is asked nothing
# more until the first of them is 10 minutes old: fail2ban bans at five in ten minutes, OSSEC's
# rule 31151 at fourteen in 90 seconds.
errorBudget:
  errors: 3
  windowMinutes: 10

# Hosting providers that cut our address on all their machines at once, with their IPv4 networks:
# every address in them is paced as one server (pace.perProvider). The legacy built this list
# from the servers that went silent (builder/tools/providers.mjs); it starts empty here, e.g.
#   combell:
#     - 185.162.28.0/22
providers: {}

# Per-source overrides, added by the source features (legacy cadence_h).
sources:
  # Austria's Bundesrechenzentrum: its vacancy feed (CC BY 4.0), one call.
  brz:
    cadenceHours: 12
  # Jobindex: robots.txt lets in only each category's first page, so it is read every hour and
  # each advert is kept until its own last day.
  jobindex:
    cadenceHours: 1
  # Iceland's State and Directorate of Labour vacancies, two calls.
  island:
    cadenceHours: 12
  # Finland's public sector: a list of about 29 pages and the pages of its new vacancies.
  kuntarekry:
    cadenceHours: 6
  valtiolle:
    cadenceHours: 6
  # Poland's Solid.Jobs: its public API, two divisions, a few calls.
  solidjobs:
    cadenceHours: 6
  # Poland's Infopraca: forty searches, every page, about five minutes.
  infopraca:
    cadenceHours: 6
  # Slovakia's ÚPSVaR: its own offers, about 125 calls of a hundred.
  upsvr:
    cadenceHours: 6
  # Hungary's public job portal: one category a pass.
  hungary:
    cadenceHours: 2
  # Romania's ANOFM: its job list, about 83 calls of a hundred offers.
  anofm:
    cadenceHours: 6
  # Cyprus's public employment service: one search per ISCO unit group of ours.
  cyprus:
    cadenceHours: 12
  # Portugal's IEFP: about 57 search pages of about 900 KB each, once a day.
  iefp:
    cadenceHours: 24
  # Brandenburg's careers portal: one call, every offer.
  brandenburg:
    cadenceHours: 12
  # service.bund.de: its feed and 20 pages of ours a pass, 30 s apart as its robots.txt asks.
  bund:
    cadenceHours: 6
  # Karriere.NRW: its open API, about a hundred pages of ten.
  karrierenrw:
    cadenceHours: 12
  # The City of Linz and its companies: the same platform's feed (CC BY 4.0), one call.
  linz:
    cadenceHours: 12
  # Upper Austria's own vacancies (CC BY 4.0), one call.
  ooe:
    cadenceHours: 12
  # Austrian public bodies' vacancies as open data (IFG), one call.
  ifgat:
    cadenceHours: 12
  # Brussels' Actiris: its own offers, about 19 calls, and the text of new ones.
  actiris:
    cadenceHours: 6
  # Emilia-Romagna's Lavoro per Te: its public search, about seven pages of a hundred.
  emilia:
    cadenceHours: 12
  # Trentino's job portal, the same platform: about eight pages of a hundred.
  trento:
    cadenceHours: 12
  # The Province of Brescia's job centres: every offer on one page.
  brescia:
    cadenceHours: 12
