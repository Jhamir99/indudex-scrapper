# How often sources are read and how hard the scrapper may work.
# Validated by src/features/crawl-core/config/crawl-config.ts.
#
# Values taken from builder/config/crawl.yml of the legacy Indudex project
# (https://github.com/JustJans/indudex, © 2026 JustJans), as of 15 November 2026.
# They are the result of its operating experience (servers and firewalls that
# turned the crawler away); change them only with a reason.

cadence:
  # One pass a day tells a closed vacancy from an open one and brings the new ones.
  defaultHours: 24
  # A source that comes back unchanged waits half as long again each pass, up to a week.
  unchangedMaxHours: 168

backoff:
  # A failing source waits a day, three, then a week; after 6 failures it is parked for a month.
  hours: [24, 72, 168]
  parkAfterFailures: 6
  parkedHours: 720

pace:
  perHost:
    gapMs: 3000
    inFlight: 1
  # Nutch's five seconds, for every host on one machine together.
  perServer:
    gapMs: 5000
    inFlight: 1
  perProvider:
    gapMs: 3000
    inFlight: 1

connections:
  # At about 7 new connections a second the legacy's home router dropped them all.
  maxOpen: 16
  newPerSecond: 2

# A server that gives 3 error answers (4xx, robots.txt aside) within 10 minutes is asked nothing
# more until the first of them is 10 minutes old: fail2ban bans at five in ten minutes, OSSEC's
# rule 31151 at fourteen in 90 seconds.
errorBudget:
  errors: 3
  windowMinutes: 10

# Hosting providers that cut our address on all their machines at once, with their IPv4 networks:
# every address in them is paced as one server (pace.perProvider). The legacy built this list
# from the servers that went silent (builder/tools/providers.mjs); it starts empty here, e.g.
#   combell:
#     - 185.162.28.0/22
providers: {}

# Per-source overrides, added by the source features, e.g.
#   brz:
#     cadenceHours: 12
sources: {}
